<div
  class="flex items-start sm:items-center gap-4 bg-white border border-slate-100 rounded-2xl p-4 sm:p-5 w-full shadow-sm hover:shadow-md hover:border-indigo-200 transition-all duration-200"
>
  <!-- accent bar -->
  <span class="hidden sm:block w-1 self-stretch rounded-full bg-indigo-500"></span>

  <!-- content -->
  <div class="flex-1 min-w-0">
    <h2 class="text-base sm:text-lg font-semibold text-slate-800 break-words">
      {{ task()?.title }}
    </h2>
    <p class="text-sm text-slate-500 mt-0.5 line-clamp-2 sm:line-clamp-1">
      {{ task()?.description }}
    </p>
    <span
      class="inline-flex items-center gap-1.5 text-xs font-medium text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full mt-2 whitespace-nowrap"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-3.5 h-3.5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
        />
      </svg>
      {{ task()?.due_at | date: 'dd MM yyyy' }}
    </span>
  </div>

  <!-- actions: always visible -->
  <div class="flex items-center gap-1 shrink-0">
    <button
      type="button"
      aria-label="Edit"
      class="p-2 rounded-lg text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 transition-colors cursor-pointer"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-4 h-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
        />
      </svg>
    </button>
    <button
      type="button"
      aria-label="Delete"
      class="p-2 rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 transition-colors cursor-pointer"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-4 h-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3M4 7h16"
        />
      </svg>
    </button>
  </div>
</div>
