<div
  class="group flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 bg-white border border-slate-100 rounded-2xl p-4 sm:p-5 w-full shadow-sm hover:shadow-lg hover:shadow-indigo-100 hover:-translate-y-0.5 hover:border-indigo-200 transition-all duration-200"
>
  <div class="flex items-start gap-3 flex-1 min-w-0">
    <!-- checkbox -->
    <button
      type="button"
      aria-label="Mark as completed"
      class="w-6 h-6 rounded-full border-2 border-slate-300 shrink-0 mt-0.5 flex items-center justify-center hover:border-indigo-500 hover:bg-indigo-50 transition-colors"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-3.5 h-3.5 text-white opacity-0"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="3"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    </button>

    <div class="flex-1 min-w-0">
      <h2 class="text-base sm:text-lg font-semibold text-slate-800 break-words">title</h2>
      <p class="text-sm text-slate-500 mt-1 line-clamp-2 sm:line-clamp-1">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Modi, officia.
      </p>
    </div>
  </div>

  <div class="flex items-center justify-between sm:justify-end gap-3 shrink-0 pl-9 sm:pl-0">
    <span
      class="flex items-center gap-1.5 text-xs font-medium text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full whitespace-nowrap"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-3.5 h-3.5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
        />
      </svg>
      Date
    </span>

    <div
      class="flex items-center gap-1 opacity-0 sm:opacity-0 group-hover:opacity-100 transition-opacity"
    >
      <button
        type="button"
        aria-label="Edit"
        class="p-1.5 rounded-lg text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 transition-colors"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-4 h-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
          />
        </svg>
      </button>
      <button
        type="button"
        aria-label="Delete"
        class="p-1.5 rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 transition-colors"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-4 h-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3M4 7h16"
          />
        </svg>
      </button>
    </div>
  </div>
</div>
