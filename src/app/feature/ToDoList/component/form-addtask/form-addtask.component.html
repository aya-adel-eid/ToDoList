<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="w-full max-w-md">
    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="w-full bg-white rounded-3xl shadow-2xl shadow-indigo-900/20 p-6 sm:p-8"
    >
      <!-- header -->
      <div class="mb-6">
        <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900">New Task</h1>
        <p class="text-slate-400 text-sm mt-1">Fill in the details below</p>
      </div>

      <!-- title -->
      <div class="mb-4">
        <label for="title" class="block text-sm font-medium text-slate-700 mb-1.5">Title</label>
        <input
          id="title"
          type="text"
          formControlName="title"
          placeholder="Buy milk"
          class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-slate-700 placeholder:text-slate-400 outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
        />
        @if (form.get('title')?.invalid && form.get('title')?.touched) {
          <p class="text-xs text-red-500 mt-1">Title is required (at least 2 characters).</p>
        }
      </div>

      <!-- description -->
      <div class="mb-4">
        <label for="description" class="block text-sm font-medium text-slate-700 mb-1.5"
          >Description</label
        >
        <textarea
          id="description"
          formControlName="description"
          rows="3"
          placeholder="From the store"
          class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-slate-700 placeholder:text-slate-400 outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition resize-none"
        ></textarea>
      </div>

      <!-- due date -->
      <div class="mb-4">
        <label for="due_at" class="block text-sm font-medium text-slate-700 mb-1.5">Due date</label>
        <div class="relative">
          <input
            id="due_at"
            type="datetime-local"
            formControlName="due_at"
            class="w-full border border-slate-200 rounded-xl px-4 py-2.5 pl-10 text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
          />
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
            />
          </svg>
        </div>
      </div>

      <!-- is_completed -->
      <div class="mb-6">
        <label class="flex items-center gap-2.5 cursor-pointer select-none w-fit">
          <input
            type="checkbox"
            formControlName="is_completed"
            class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer"
          />
          <span class="text-sm text-slate-600">Mark as completed</span>
        </label>
      </div>

      <!-- actions -->
      <div class="flex items-center gap-3">
        <button
          type="submit"
          class="flex-1 bg-indigo-600 hover:bg-indigo-700 transition text-white font-medium rounded-xl px-5 py-2.5 cursor-pointer"
        >
          Save Task
        </button>
        <button
          type="button"
          (click)="toggle()"
          class="px-5 py-2.5 rounded-xl text-slate-500 bg-slate-100 hover:bg-slate-200 transition font-medium cursor-pointer"
        >
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
