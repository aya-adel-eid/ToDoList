<section
  class="bg-gradient-to-br from-[#a297f0] to-[#a9a5ea] min-h-screen p-4 sm:p-10 flex items-start justify-center"
>
  <div class="w-full max-w-3xl bg-white rounded-3xl shadow-2xl shadow-indigo-900/20 p-6 sm:p-10">
    <!-- Header -->
    <div class="text-center mb-8 sm:mb-10">
      <div class="flex items-center justify-center gap-3 mb-2">
        <div
          class="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center text-indigo-600 shrink-0"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-6 h-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"
            />
          </svg>
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
          My To Do List
        </h1>
      </div>
      <p class="text-slate-400 font-medium text-sm sm:text-base">Stay organized, get more done</p>
    </div>
    <!-- add Task -->
    <div class="justify-center py-3 flex">
      <button
        class="bg-[#968aed] px-6 py-2 rounded-2xl text-white font-semibold cursor-pointer"
        (click)="toggle()"
      >
        Add New Task
      </button>
    </div>

    <!-- cards -->
    <div class="space-y-3 sm:space-y-4 flex flex-col gap-6">
      @for (task of allTasks(); track task.id) {
        <app-to-dolist-card [(task)]="task!"></app-to-dolist-card>
      }
    </div>
  </div>
</section>
@if (openModul()) {
  <app-form-addtask></app-form-addtask>
}
